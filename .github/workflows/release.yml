name: Release

# Build signed installers + auto-update manifest whenever you push a version tag (e.g. v0.1.0).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Fast gate: typecheck + unit tests + the RUST tests must pass before any
  # installer builds start. The Rust tests cover the two security boundaries —
  # the open_external shell-quote breakout and the export path allowlist — and were
  # previously in neither gate, so a regression in either could have shipped green.
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend deps
        run: npm ci || npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Install Linux build deps (needed to compile the Rust crate)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        run: npm ci || npm install

      - name: Build + publish (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Baked into the frontend by Vite (beforeBuildCommand: npm run build) so a
          # shipped user never has to paste a Google client secret. Absent in forks /
          # PRs without the secret — the app then says Google sign-in is unavailable
          # in that build and keeps working anonymously. NOTE: v0.8.39 was tagged 11
          # minutes BEFORE this secret existed, so that one release shipped without
          # it; v0.8.40 onward have it.
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "W.T.E ${{ github.ref_name }}"
          releaseBody: "Automated build. The auto-updater reads latest.json from this release."
          releaseDraft: false
          prerelease: false
          # tauri-action publishes the platform installers + latest.json (the updater manifest)
          updaterJsonPreferNsis: true
